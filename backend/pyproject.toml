[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-backend"
version = "1.0.0"
description = "RepoPilot AI Backend Service"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "pyyaml>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E722"]
